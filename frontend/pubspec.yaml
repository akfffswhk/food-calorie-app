name: food_calorie_app
description: Food Calorie Analyzer - Track your food calories with AI
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0

  # State Management
  provider: ^6.1.1

  # Networking
  http: ^1.1.2
  dio: ^5.4.0

  # Image Handling
  image_picker: ^1.0.5
  camera: ^0.10.5+5
  image_cropper: ^5.0.1

  # Storage
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1

  # Utils
  intl: ^0.18.1
  uuid: ^4.2.1
  logger: ^2.0.2+1

  # Charts
  fl_chart: ^0.66.0

  # Auth
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: fonts/CustomFont-Regular.ttf
